<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a4d"/>
      <stop offset="1" stop-color="#002D72"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ff9a63"/>
      <stop offset="0.6" stop-color="#FF5910"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5910" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5910" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="512" height="330"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g id="motiv">
    <!-- Sonnenbogen -->
    <path d="M70 330 C 140 120, 372 120, 442 330" fill="none" stroke="#ffffff" stroke-opacity="0.85"
          stroke-width="12" stroke-linecap="round" stroke-dasharray="2 30"/>
    <!-- Sonne mit Strahlen, nur über dem Horizont -->
    <g clip-path="url(#above)">
      <circle cx="256" cy="300" r="170" fill="url(#glow)"/>
      <g stroke="#FF5910" stroke-width="18" stroke-linecap="round">
        <line x1="256" y1="150" x2="256" y2="112"/>
        <line x1="162" y1="186" x2="138" y2="160"/>
        <line x1="350" y1="186" x2="374" y2="160"/>
        <line x1="124" y1="262" x2="88" y2="250"/>
        <line x1="388" y1="262" x2="424" y2="250"/>
      </g>
      <circle cx="256" cy="300" r="104" fill="url(#sun)"/>
    </g>
    <!-- Horizont -->
    <rect x="56" y="324" width="400" height="16" rx="8" fill="#ffffff"/>
    <rect x="136" y="366" width="240" height="14" rx="7" fill="#FF5910"/>
    <rect x="196" y="404" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.8"/>
  </g>
</svg>
