<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonnenstand & Dämmerung</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        header {
            text-align: center;
            padding: 8px 0;
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        input[type="text"], input[type="date"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-color);
            font-size: 0.95rem;
        }
        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            min-height: 42px;
        }
        button.secondary {
            background: #334155;
            color: var(--text-color);
        }
        #map {
            height: 280px;
            border-radius: 8px;
            z-index: 1;
        }
        .date-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .quick-dates {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: space-between;
        }
        .quick-dates button {
            flex: 1;
            padding: 8px 4px;
            font-size: 0.85rem;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .result-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .result-box .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .result-box .val {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        .full-width {
            grid-column: span 2;
        }
        .location-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-align: center;
        }
        canvas {
            width: 100%;
            height: 120px;
            margin-top: 8px;
        }
        .status {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sonnenauf- & Untergang</h1>
        </header>

        <div class="card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ort suchen...">
                <button onclick="searchLocation()">Suchen</button>
                <button class="secondary" onclick="useGPS()" title="Mein Standort">📍</button>
            </div>
            <div id="map"></div>
        </div>

        <div class="card">
            <div class="date-controls">
                <button class="secondary" onclick="changeDate(-1)">◄ Tag</button>
                <input type="date" id="dateInput" onchange="updateData()">
                <button class="secondary" onclick="changeDate(1)">Tag ►</button>
            </div>
            <div class="quick-dates">
                <button class="secondary" onclick="setDateOffset(-1)">Gestern</button>
                <button onclick="setToday()">Heute</button>
                <button class="secondary" onclick="setDateOffset(1)">Morgen</button>
            </div>

            <div id="status" class="status"></div>
            <div id="locationName" class="location-info">Standort wird ermittelt...</div>

            <div class="results-grid">
                <div class="result-box">
                    <div class="label">🌅 Sonnenaufgang</div>
                    <div class="val" id="sunrise">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">🌇 Sonnenuntergang</div>
                    <div class="val" id="sunset">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">☀️ Höchststand</div>
                    <div class="val" id="solarnoon">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">⏱️ Tageslänge</div>
                    <div class="val" id="daylength">-- Std -- Min</div>
                </div>
                <div class="result-box full-width">
                    <div class="label">Sonnenverlauf</div>
                    <canvas id="sunCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker;
        let currentLat = 50.04;
        let currentLng = 8.24;

        const dateInput = document.getElementById('dateInput');
        dateInput.value = new Date().toISOString().split('T')[0];

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);

            map.on('click', function(e) {
                setPosition(e.latlng.lat, e.latlng.lng);
            });

            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                setPosition(pos.lat, pos.lng);
            });

            useGPS();
        }

        function useGPS() {
            showStatus("Ermittle GPS-Standort...");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        setPosition(position.coords.latitude, position.coords.longitude, true);
                        showStatus("");
                    },
                    function(error) {
                        showStatus("GPS nicht freigegeben. Standardstandort gewählt.");
                        setPosition(50.04, 8.24, true);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                showStatus("GPS wird von diesem Browser nicht unterstützt.");
                setPosition(50.04, 8.24, true);
            }
        }

        function setPosition(lat, lng, centerMap = false) {
            currentLat = lat;
            currentLng = lng;
            marker.setLatLng([lat, lng]);
            if (centerMap) {
                map.setView([lat, lng], 11);
            }
            updateData();
            reverseGeocode(lat, lng);
        }

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        function setToday() {
            dateInput.value = new Date().toISOString().split('T')[0];
            updateData();
        }

        function setDateOffset(offsetDays) {
            const d = new Date(dateInput.value || new Date());
            d.setDate(d.getDate() + offsetDays);
            dateInput.value = d.toISOString().split('T')[0];
            updateData();
        }

        function changeDate(days) {
            setDateOffset(days);
        }

        async function searchLocation() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            showStatus("Suche Ort...");
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setPosition(lat, lon, true);
                    document.getElementById('locationName').innerText = data[0].display_name;
                    showStatus("");
                } else {
                    showStatus("Ort nicht gefunden.");
                }
            } catch (e) {
                showStatus("Fehler bei der Ortssuche.");
            }
        }

        async function reverseGeocode(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                if (data && data.display_name) {
                    document.getElementById('locationName').innerText = data.display_name;
                }
            } catch (e) {
                document.getElementById('locationName').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
            }
        }

        async function updateData() {
            const date = dateInput.value;
            if (!date) return;

            showStatus("Berechne Zeiten...");
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&daily=sunrise,sunset&timezone=auto&start_date=${date}&end_date=${date}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data && data.daily && data.daily.sunrise && data.daily.sunset) {
                    const sunriseISO = data.daily.sunrise[0];
                    const sunsetISO = data.daily.sunset[0];

                    const srDate = new Date(sunriseISO);
                    const ssDate = new Date(sunsetISO);

                    const sunriseTime = sunriseISO.split('T')[1].substring(0, 5);
                    const sunsetTime = sunsetISO.split('T')[1].substring(0, 5);

                    const noonMs = srDate.getTime() + (ssDate.getTime() - srDate.getTime()) / 2;
                    const noonDate = new Date(noonMs);
                    const solarNoonHours = String(noonDate.getHours()).padStart(2, '0');
                    const solarNoonMinutes = String(noonDate.getMinutes()).padStart(2, '0');
                    const solarNoonTime = `${solarNoonHours}:${solarNoonMinutes}`;

                    document.getElementById('sunrise').innerText = sunriseTime;
                    document.getElementById('sunset').innerText = sunsetTime;
                    document.getElementById('solarnoon').innerText = solarNoonTime;

                    const diffMs = ssDate - srDate;
                    const diffHrs = Math.floor(diffMs / 3600000);
                    const diffMins = Math.round((diffMs % 3600000) / 60000);
                    document.getElementById('daylength').innerText = `${diffHrs} Std ${diffMins} Min`;

                    drawSunArc(srDate, ssDate);
                    showStatus("");
                } else {
                    showStatus("Keine Daten erhalten.");
                }
            } catch (e) {
                showStatus("Fehler beim Abrufen der Sonnendaten.");
            }
        }

        function drawSunArc(sunriseDate, sunsetDate) {
            const canvas = document.getElementById('sunCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, h - 20);
            ctx.lineTo(w - 10, h - 20);
            ctx.stroke();

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, h - 20);
            ctx.quadraticCurveTo(w / 2, 10, w - 20, h - 20);
            ctx.stroke();

            const now = new Date();
            const selectedDate = new Date(dateInput.value);
            const isToday = now.toDateString() === selectedDate.toDateString();

            if (isToday) {
                const totalDay = sunsetDate - sunriseDate;
                const currentProgress = (now - sunriseDate) / totalDay;

                if (currentProgress >= 0 && currentProgress <= 1) {
                    const cx = 20 + currentProgress * (w - 40);
                    const t = currentProgress;
                    const cy = (1 - t) * (1 - t) * (h - 20) + 2 * (1 - t) * t * 10 + t * t * (h - 20);

                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
