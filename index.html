<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonnenstand</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        header {
            text-align: center;
            padding: 8px 0;
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        input[type="text"], input[type="date"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-color);
            font-size: 0.95rem;
        }
        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            min-height: 42px;
        }
        button.secondary {
            background: #334155;
            color: var(--text-color);
        }
        #map {
            height: 280px;
            border-radius: 8px;
            z-index: 1;
        }
        .date-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .quick-dates {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: space-between;
        }
        .quick-dates button {
            flex: 1;
            padding: 8px 4px;
            font-size: 0.85rem;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .result-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .result-box .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .result-box .val {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        .full-width {
            grid-column: span 2;
        }
        .location-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-align: center;
        }
        canvas {
            width: 100%;
            height: 120px;
            margin-top: 8px;
        }
        .status {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sonnenstand</h1>
        </header>

        <div class="card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ort suchen..." aria-label="Ort suchen">
                <button onclick="searchLocation()">Suchen</button>
                <button class="secondary" onclick="useGPS()" title="Mein Standort" aria-label="Mein Standort">📍</button>
            </div>
            <div id="map"></div>
        </div>

        <div class="card">
            <div class="date-controls">
                <button class="secondary" onclick="changeDate(-1)">◄ Tag</button>
                <input type="date" id="dateInput" onchange="updateData()" aria-label="Datum">
                <button class="secondary" onclick="changeDate(1)">Tag ►</button>
            </div>
            <div class="quick-dates">
                <button class="secondary" onclick="setDateOffset(-1)">Gestern</button>
                <button onclick="setToday()">Heute</button>
                <button class="secondary" onclick="setDateOffset(1)">Morgen</button>
            </div>

            <div id="status" class="status"></div>
            <div id="locationName" class="location-info">Standort wird ermittelt...</div>

            <div class="results-grid">
                <div class="result-box">
                    <div class="label">🌄 Morgendämmerung</div>
                    <div class="val" id="dawn">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">🌆 Abenddämmerung</div>
                    <div class="val" id="dusk">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">🌅 Sonnenaufgang</div>
                    <div class="val" id="sunrise">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">🌇 Sonnenuntergang</div>
                    <div class="val" id="sunset">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">☀️ Höchststand</div>
                    <div class="val" id="solarnoon">--:--</div>
                </div>
                <div class="result-box">
                    <div class="label">⏱️ Tageslänge</div>
                    <div class="val" id="daylength">-- Std -- Min</div>
                </div>
                <div class="result-box full-width">
                    <div class="label">Sonnenverlauf</div>
                    <canvas id="sunCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <script>
        const DEFAULT_LAT = 50.04;
        const DEFAULT_LNG = 8.24;

        let map, marker;
        let currentLat = DEFAULT_LAT;
        let currentLng = DEFAULT_LNG;

        const dateInput = document.getElementById('dateInput');
        dateInput.value = formatDateForInput(new Date());

        // Datum im Format JJJJ-MM-TT, in der Ortszeit des Geräts (nicht UTC)
        function formatDateForInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // Liest das Datumsfeld und gibt Mittag des gewählten Tages zurück
        function selectedDate() {
            const [year, month, day] = dateInput.value.split('-').map(Number);
            return new Date(year, month - 1, day, 12, 0, 0);
        }

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);

            map.on('click', function (e) {
                setPosition(e.latlng.lat, e.latlng.lng);
            });

            marker.on('dragend', function () {
                const pos = marker.getLatLng();
                setPosition(pos.lat, pos.lng);
            });

            document.getElementById('searchInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') searchLocation();
            });

            useGPS();
        }

        function useGPS() {
            showStatus("Ermittle GPS-Standort...");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        setPosition(position.coords.latitude, position.coords.longitude, true);
                        showStatus("");
                    },
                    function () {
                        showStatus("GPS nicht freigegeben. Standardstandort gewählt.");
                        setPosition(DEFAULT_LAT, DEFAULT_LNG, true);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                showStatus("GPS wird von diesem Browser nicht unterstützt.");
                setPosition(DEFAULT_LAT, DEFAULT_LNG, true);
            }
        }

        function setPosition(lat, lng, centerMap = false) {
            currentLat = lat;
            currentLng = lng;
            marker.setLatLng([lat, lng]);
            if (centerMap) {
                map.setView([lat, lng], 11);
            }
            updateData();
            reverseGeocode(lat, lng);
        }

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        function setToday() {
            dateInput.value = formatDateForInput(new Date());
            updateData();
        }

        function setDateOffset(offsetDays) {
            const d = selectedDate();
            d.setDate(d.getDate() + offsetDays);
            dateInput.value = formatDateForInput(d);
            updateData();
        }

        function changeDate(days) {
            setDateOffset(days);
        }

        async function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            showStatus("Suche Ort...");
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q=${encodeURIComponent(query)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setPosition(lat, lon, true);
                    document.getElementById('locationName').innerText = data[0].display_name;
                    showStatus("");
                } else {
                    showStatus("Ort nicht gefunden.");
                }
            } catch (e) {
                showStatus("Fehler bei der Ortssuche.");
            }
        }

        async function reverseGeocode(lat, lng) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&accept-language=de&lat=${lat}&lon=${lng}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.display_name) {
                    document.getElementById('locationName').innerText = data.display_name;
                }
            } catch (e) {
                document.getElementById('locationName').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
            }
        }

        function formatHHMM(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return '--:--';
            const hrs = String(dateObj.getHours()).padStart(2, '0');
            const mins = String(dateObj.getMinutes()).padStart(2, '0');
            return `${hrs}:${mins}`;
        }

        function resetResults() {
            ['dawn', 'dusk', 'sunrise', 'sunset', 'solarnoon'].forEach(id => {
                document.getElementById(id).innerText = "--:--";
            });
            document.getElementById('daylength').innerText = "-- Std -- Min";
        }

        function updateData() {
            if (!dateInput.value) return;
            showStatus("");

            const targetDate = selectedDate();
            const times = SunCalc.getTimes(targetDate, currentLat, currentLng);

            const srDate = times.sunrise;
            const ssDate = times.sunset;

            if (srDate && ssDate && !isNaN(srDate.getTime()) && !isNaN(ssDate.getTime())) {
                document.getElementById('dawn').innerText = formatHHMM(times.dawn);
                document.getElementById('dusk').innerText = formatHHMM(times.dusk);
                document.getElementById('sunrise').innerText = formatHHMM(srDate);
                document.getElementById('sunset').innerText = formatHHMM(ssDate);
                document.getElementById('solarnoon').innerText = formatHHMM(times.solarNoon);

                const diffMs = ssDate - srDate;
                const diffHrs = Math.floor(diffMs / 3600000);
                const diffMins = Math.round((diffMs % 3600000) / 60000);
                document.getElementById('daylength').innerText = `${diffHrs} Std ${diffMins} Min`;

                drawSunArc(srDate, ssDate, targetDate);
            } else {
                showStatus("Polartag oder Polarnacht.");
                resetResults();
                drawSunArc(null, null, targetDate);
            }
        }

        // Punkt auf der (quadratischen) Bezier-Kurve des Sonnenbogens
        function arcPoint(t, w, h) {
            const x = (1 - t) * (1 - t) * 20 + 2 * (1 - t) * t * (w / 2) + t * t * (w - 20);
            const y = (1 - t) * (1 - t) * (h - 20) + 2 * (1 - t) * t * 10 + t * t * (h - 20);
            return { x, y };
        }

        function drawSunArc(sunriseDate, sunsetDate, selectedDay) {
            const canvas = document.getElementById('sunCanvas');
            const ctx = canvas.getContext('2d');

            // Scharf auch auf Bildschirmen mit hoher Auflösung (Handy)
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // Horizont
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, h - 20);
            ctx.lineTo(w - 10, h - 20);
            ctx.stroke();

            // Sonnenbogen
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, h - 20);
            ctx.quadraticCurveTo(w / 2, 10, w - 20, h - 20);
            ctx.stroke();

            if (!sunriseDate || !sunsetDate) return;

            // Aktuelle Sonnenposition, nur wenn der gewählte Tag heute ist
            const now = new Date();
            const isToday = now.toDateString() === selectedDay.toDateString();
            if (!isToday) return;

            const progress = (now - sunriseDate) / (sunsetDate - sunriseDate);
            if (progress >= 0 && progress <= 1) {
                const p = arcPoint(progress, w, h);
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
